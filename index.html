<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><link rel='manifest' href='manifest.json'><title>Prompt Pro</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#0b1020,#172554 45%,#111827);color:#fff;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:20px 16px 90px}.hero{display:flex;gap:14px;align-items:center}.hero img{width:76px;height:76px;border-radius:20px;object-fit:cover;box-shadow:0 8px 28px #0008}.hero h1{margin:0;font-size:28px}.hero p{margin:4px 0;color:#cbd5e1}.search{width:100%;margin:22px 0 14px;padding:15px 17px;border:0;border-radius:16px;font-size:16px;background:#fff;color:#111827}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid #ffffff1f;background:#ffffff12;backdrop-filter:blur(8px);border-radius:20px;padding:18px;min-height:112px;cursor:pointer}.card b{display:block;font-size:17px;margin-top:8px}.card span{font-size:29px}.generator{margin-top:18px;padding:18px;border-radius:22px;background:linear-gradient(135deg,#7c3aed,#2563eb)}textarea,select{width:100%;border:0;border-radius:14px;padding:13px;margin-top:10px;font:inherit}.btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:10px;font-weight:800;font-size:16px;cursor:pointer}.output{white-space:pre-wrap;background:#fff;color:#111827;padding:14px;border-radius:14px;margin-top:10px;display:none}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center}.sheet{background:#f8fafc;color:#111827;width:min(720px,100%);max-height:82vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px}.prompt{padding:14px;border-radius:14px;background:#e2e8f0;margin:10px 0}.prompt button{float:right}.close{float:right;border:0;background:#e2e8f0;border-radius:10px;padding:8px 11px}</style></head><body><main class='wrap'><div class='hero'><img src='icon.png'><div><h1>Prompt Pro</h1><p>Biblioteca de Prompts</p></div></div><input id='search' class='search' placeholder='🔎 Pesquisar prompts e categorias...'><section id='grid' class='grid'></section><section class='generator'><h2 style='margin-top:0'>✨ Gerador de Prompt</h2><p>Escreva sua ideia e transforme em um comando mais completo.</p><select id='type'><option>Imagem</option><option>Vídeo</option><option>Texto</option><option>Aplicativo</option><option>Site</option></select><textarea id='idea' rows='4' placeholder='Ex.: Davi enfrentando Golias em uma cena cinematográfica'></textarea><button class='btn' onclick='generate()'>GERAR PROMPT</button><div id='output' class='output'></div><button id='copyGen' class='btn' style='display:none' onclick='copyOut()'>📋 COPIAR PROMPT</button></section></main><div id='modal' class='modal' onclick='if(event.target===this)closeM()'><div class='sheet'><button class='close' onclick='closeM()'>✕</button><h2 id='mt'></h2><div id='plist'></div></div></div><script>
const cats=[['🎨','Criar Imagem'],['🎬','Criar Vídeo'],['📸','Editar Foto'],['⛪','Igreja & Bíblia'],['📱','Redes Sociais'],['✍️','Textos'],['📊','Planilhas'],['📲','Criar Aplicativos'],['🌐','Sites'],['💡','Prompt Mestre'],['⭐','Favoritos'],['➕','Meus Prompts']];
const examples={
'Criar Imagem':['Crie uma imagem cinematográfica de [TEMA], com iluminação dramática, composição profissional, alto nível de detalhes, cores equilibradas, formato [FORMATO], sem marcas d’água.','Crie uma arte para divulgação de [EVENTO], com título “[TÍTULO]”, visual moderno, texto perfeitamente legível e espaço organizado para data, horário e local.'],
'Criar Vídeo':['Crie um vídeo de [TEMA] dividido em cenas de 8 segundos. Para cada cena descreva personagem, ação, cenário, movimento de câmera, iluminação, efeitos sonoros e continuidade visual.','Crie um vídeo vertical 9:16 de 30 segundos sobre [TEMA], com abertura impactante nos 3 primeiros segundos, cenas dinâmicas, narração e encerramento memorável.'],
'Editar Foto':['Edite esta fotografia preservando completamente a fisionomia das pessoas. Corrija iluminação, nitidez e cores, remova apenas [ELEMENTO] e mantenha aparência natural e realista.'],
'Igreja & Bíblia':['Crie uma arte cristã sobre [TEMA] baseada em [PASSAGEM], com atmosfera reverente, letras grandes e legíveis, fundo impactante e sem símbolos que não tenham sido solicitados.'],
'Redes Sociais':['Crie uma publicação para [REDE] sobre [TEMA], com gancho forte, texto curto, chamada para ação e linguagem adequada ao público [PÚBLICO].'],
'Textos':['Escreva um texto sobre [TEMA] para [OBJETIVO], com tom [TOM], linguagem clara, estrutura organizada e conclusão prática.'],
'Planilhas':['Crie uma planilha para [OBJETIVO], com abas necessárias, campos [CAMPOS], fórmulas automáticas, totais, indicadores e formatação clara para uso no celular e computador.'],
'Criar Aplicativos':['Crie um aplicativo chamado [NOME] para [OBJETIVO]. Inclua tela inicial, cadastro, pesquisa, edição, exclusão, favoritos, backup e interface simples para celular.'],
'Sites':['Crie um site responsivo para [OBJETIVO], com página inicial, seções [SEÇÕES], navegação simples, design moderno e excelente experiência em celular.'],
'Prompt Mestre':['Transforme a seguinte ideia em um prompt profissional e detalhado: [IDEIA]. Identifique objetivo, contexto, formato de saída, estilo, restrições e critérios de qualidade. Entregue somente o prompt final.']};
const grid=document.getElementById('grid');function render(q=''){grid.innerHTML='';cats.filter(x=>x[1].toLowerCase().includes(q.toLowerCase())).forEach(c=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<span>${c[0]}</span><b>${c[1]}</b>`;d.onclick=()=>openC(c[1]);grid.appendChild(d)})}render();search.oninput=e=>render(e.target.value);
function openC(name){mt.textContent=name;plist.innerHTML='';let arr=examples[name]||['Esta área ficará disponível para você salvar seus próprios prompts.'];arr.forEach((p,i)=>{let d=document.createElement('div');d.className='prompt';d.innerHTML=`<button onclick="navigator.clipboard.writeText(${JSON.stringify(p).replace(/"/g,'&quot;')})">Copiar</button><b>Prompt ${i+1}</b><br><br>${p}`;plist.appendChild(d)});modal.style.display='flex'}function closeM(){modal.style.display='none'}
function generate(){let idea=document.getElementById('idea').value.trim(),t=document.getElementById('type').value;if(!idea)return;let map={Imagem:'Crie uma imagem profissional e detalhada de',Vídeo:'Crie um vídeo profissional, dividido em cenas coerentes, sobre',Texto:'Escreva um texto completo, claro e envolvente sobre',Aplicativo:'Projete um aplicativo responsivo e simples de usar para',Site:'Crie um site responsivo, moderno e intuitivo para'};let extra=t==='Vídeo'?' Descreva cenas, duração, personagens, ações, câmera, iluminação, áudio e continuidade. Se apropriado, divida em blocos de 8 segundos.':t==='Imagem'?' Defina composição, cenário, iluminação, estilo visual, enquadramento, proporção e detalhes essenciais.':' Inclua objetivo, estrutura, requisitos, restrições e critérios de qualidade.';output.textContent=`${map[t]} ${idea}.${extra} Entregue um resultado pronto para uso, sem explicações desnecessárias.`;output.style.display='block';copyGen.style.display='block'}function copyOut(){navigator.clipboard.writeText(output.textContent)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
